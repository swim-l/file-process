<div class="container">
    <app-page-header [title]="'Txt文件切割工具'" [description]="'在线Txt文件切割工具，支持将一个Txt文件按指定行数切割拆分为多个小Txt文件'"></app-page-header>
    <div class="tool-content">
        <app-split desc="zhichi"></app-split>
        <div class="tool-info">
            <h3>使用说明</h3>
            <ol>
                <li>设置分割行数：输入希望每个小文件包含的行数</li>
                <li>上传Excel文件：点击上传或将文件拖入文件上传框</li>
                <li>系统会自动将文件切割成多个部分并下载</li>
            </ol>
        </div>
    </div>
</div>
